<body>

    <div class="header-brand">
        <span style="font-size: 20px;">🛍️</span>
        <h2 class="brand-title">sub4unloock</h2>
    </div>

    <div class="main-card">
        <h1 class="title">Complete Steps to Unlock</h1>
        <span class="badge-step">COMPLETE ALL STEPS BELOW</span>

        <div class="task-list" id="taskListContainer">
            <p style="color:#64748b; font-size:13px;">⏳ Memuat data tugas...</p>
        </div>

        <div class="progress-text" id="progressText">Steps Completed 0/0</div>

        <!-- ========================================================= -->
        <!-- [3] ADSTERRA: NATIVE BANNER -->
        <!-- ========================================================= -->

            <script async="async" data-cfasync="false" src="https://bauval.org/21/6b5eca2bdea6cb445f3ba6dbcda463ab"></script>
            <div id="container-6b5eca2bdea6cb445f3ba6dbcda463ab"></div>
        </div>

        <button id="unlockBtn" class="get-link-btn" onclick="openFinalLink()" disabled>
            <span>🔗 Get Your Link</span>
            <span>➔</span>
        </button>

        <div class="creator-box">
            <div class="creator-title">🤖 Link Created With Sub4Unloock.Com</div>
            <button class="btn-create-same" onclick="goToGenerator()">🔗 CREATE SAME LOCKED LINK</button>

    <div class="info-footer-section">

    </div>

    <script>
        const SUPABASE_URL = 'https://rhlfowrffdjkiqlckzwf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable__0Ani2ZnbQxeLEVrVjCvEQ_aAx4SV3c';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const ADSTERRA_SMARTLINK = "https://asiafilm.org/4/13722116901b22fc8103d89238d62dea";

        let DESTINATION_URL = "";
        let taskList = [];
        let completedCount = 0;

        // FUNGSI PINTAR EKSTRAKSI ID LINK DARI BERBAGAI FORMAT URL
        function getLinkIdFromURL() {
            const searchParams = new URLSearchParams(window.location.search);
            if (searchParams.has('id')) {
                return searchParams.get('id');
            }

            const path = window.location.pathname;
            const segments = path.split('/').filter(Boolean);
            
            // Mengambil elemen terakhir dari URL path
            if (segments.length > 0) {
                const lastSegment = segments[segments.length - 1];
                if (lastSegment !== 'unlock.html' && lastSegment !== 'unlock') {
                    return lastSegment;
                }
            }
            return null;
        }

        window.onload = async function() {
            const linkId = getLinkIdFromURL();
            const container = document.getElementById('taskListContainer');

            if (!linkId) {
                container.innerHTML = '<p style="color:#ef4444; font-size:13px; margin: 10px 0;">⚠️ Link ID tidak ditemukan di URL.</p>';
                return;
            }

            try {
                const { data, error } = await db.from('links').select('*').eq('id', linkId).single();

                if (error || !data) {
                    console.error("Supabase query error:", error);
                    container.innerHTML = `<p style="color:#ef4444; font-size:13px; margin: 10px 0;">⚠️ Data link ID (${linkId}) tidak ditemukan di database.</p>`;
                    return;
                }

                DESTINATION_URL = data.t;
                if (data.s) taskList.push({ name: 'Subscribe Channel', url: data.s });
                if (data.l) taskList.push({ name: 'Like & Comment on Video', url: data.l });
                if (data.i) taskList.push({ name: 'Follow Instagram', url: data.i });
                if (data.g) taskList.push({ name: 'Join Telegram', url: data.g });
                if (data.w) taskList.push({ name: 'Join WhatsApp', url: data.w });

                renderTasks();

            } catch (e) {
                console.error("Fetch Exception:", e);
                container.innerHTML = '<p style="color:#ef4444; font-size:13px; margin: 10px 0;">⚠️ Terjadi kesalahan saat membaca database.</p>';
            }
        };

        function renderTasks() {
            const container = document.getElementById('taskListContainer');
            container.innerHTML = '';

            if (taskList.length === 0) {
                container.innerHTML = '<p style="color:#64748b; font-size:13px; margin: 10px 0;">Tidak ada syarat tugas.</p>';
                const unlockBtn = document.getElementById('unlockBtn');
                if (unlockBtn) {
                    unlockBtn.classList.add('active');
                    unlockBtn.disabled = false;
                }
            } else {
                taskList.forEach((task, index) => {
                    const btnNumber = index + 1;
                    const btn = document.createElement('button');
                    btn.id = `task${btnNumber}`;
                    btn.className = 'btn-task';
                    if (btnNumber > 1) btn.disabled = true;

                    btn.onclick = () => processTask(btnNumber, task.url);

                    btn.innerHTML = `
                        <div class="step-icon-left">
                            <span>▶</span>
                            <span>${task.name}</span>
                        </div>
                        <span class="step-arrow" id="arrow${btnNumber}">➔</span>
                    `;
                    container.appendChild(btn);
                });
            }
            updateProgress();
        }

        function updateProgress() {
            document.getElementById('progressText').innerText = `Steps Completed ${completedCount}/${taskList.length}`;
        }

        function processTask(taskNumber, taskUrl) {
            if (taskUrl) {
                if (ADSTERRA_SMARTLINK) {
                    window.open(ADSTERRA_SMARTLINK, '_blank');
                }
                setTimeout(() => {
                    window.location.href = taskUrl;
                }, 300);
            }

            const currentBtn = document.getElementById(`task${taskNumber}`);
            const currentArrow = document.getElementById(`arrow${taskNumber}`);
            
            if (currentBtn && !currentBtn.classList.contains('done')) {
                currentBtn.classList.add('done');
                currentBtn.disabled = true;
                if (currentArrow) currentArrow.innerText = "✓";
                completedCount++;
                updateProgress();
            }

            const nextTaskNumber = taskNumber + 1;
            const nextBtn = document.getElementById(`task${nextTaskNumber}`);
            if (nextBtn) {
                nextBtn.disabled = false;
            } else {
                const unlockBtn = document.getElementById('unlockBtn');
                if (unlockBtn) {
                    unlockBtn.classList.add('active');
                    unlockBtn.disabled = false;
                }
            }
        }

        function openFinalLink() {
            if (DESTINATION_URL) {
                window.location.href = DESTINATION_URL;
            }
        }

        function goToGenerator() {
            window.location.href = '/';
        }

        window.addEventListener('blur', () => {
            document.body.classList.add('blurred');
        });

        window.addEventListener('focus', () => {
            document.body.classList.remove('blurred');
        });
    </script>
